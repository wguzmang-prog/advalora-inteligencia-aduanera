<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Copper orange gradient for continents -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E27228"/>
      <stop offset="50%" stop-color="#C55615"/>
      <stop offset="100%" stop-color="#8F3507"/>
    </linearGradient>
    <linearGradient id="copperHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9B54"/>
      <stop offset="100%" stop-color="#B8490B"/>
    </linearGradient>
    <radialGradient id="globeBack" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EBF4FE" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Background disc for contrast -->
  <circle cx="64" cy="64" r="60" fill="url(#globeBack)" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.2"/>

  <!-- Blue longitude & latitude grid lines -->
  <!-- Outer rim / Equator -->
  <ellipse cx="64" cy="64" rx="52" ry="34" fill="none" stroke="#0284C7" stroke-width="3" />
  
  <!-- Horizontal Parallels -->
  <ellipse cx="64" cy="46" rx="46" ry="24" fill="none" stroke="#0284C7" stroke-width="2" stroke-opacity="0.75" />
  <ellipse cx="64" cy="82" rx="46" ry="24" fill="none" stroke="#0284C7" stroke-width="2" stroke-opacity="0.75" />
  <ellipse cx="64" cy="32" rx="33" ry="14" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.6" />
  <ellipse cx="64" cy="96" rx="33" ry="14" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Vertical Meridians -->
  <ellipse cx="64" cy="64" rx="32" ry="46" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-opacity="0.85" />
  <ellipse cx="64" cy="64" rx="14" ry="48" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-opacity="0.85" />
  <line x1="64" y1="16" x2="64" y2="112" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Stylized 3D Continents in Copper Orange Relief -->
  <!-- Americas / South America & Peru Focus -->
  <path d="M 32 44 Q 38 40 44 46 Q 48 54 42 62 Q 35 68 34 76 Q 32 86 38 94 Q 42 98 40 100 Q 34 98 30 88 Q 26 78 28 66 Q 26 54 32 44 Z" 
        fill="url(#copperGrad)" stroke="#742A06" stroke-width="1.2" />

  <!-- Eurasia / Africa Block -->
  <path d="M 52 38 Q 66 32 82 34 Q 96 38 98 48 Q 94 56 88 58 Q 80 54 74 60 Q 70 68 76 78 Q 82 88 78 94 Q 70 96 64 88 Q 58 80 56 68 Q 52 56 52 38 Z" 
        fill="url(#copperHighlight)" stroke="#742A06" stroke-width="1.2" />

  <!-- Australia / Asia East Coast accents -->
  <path d="M 88 68 Q 96 66 98 74 Q 96 82 90 84 Q 84 80 88 68 Z" 
        fill="url(#copperGrad)" stroke="#742A06" stroke-width="1" />

  <!-- Tiny Highlight star / Peru customs hub point -->
  <circle cx="35" cy="72" r="2.2" fill="#FFD600" stroke="#8F3507" stroke-width="0.8"/>
</svg>
